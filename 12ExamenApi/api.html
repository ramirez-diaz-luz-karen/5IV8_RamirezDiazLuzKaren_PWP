<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Examen API</title>
    <link rel="stylesheet" href="./css/style.css">
    <script src="https://kit.fontawesome.com/101326ea39.js" ></script>
</head>
<body>
    <section class="half" >
        <div class="d-flex center-flex" >
            <input type="text" id="perName" class="lcd-input" placeholder="Ingrese el nombre del personaje" />
            <input type="hidden" id="perId" value="0">
            <button id="btnSearch" class="btn" > <i class="fa-solid fa-magnifying-glass" ></i> </button>
            <div class="columns-elements" >
                <button class="btn" id="btnUp" > <i class="fa-solid fa-caret-up" ></i> </button>
                <button class="btn" id="btnDown" > <i class="fa-solid fa-caret-down" ></i> </button>
            </div>
        </div>
        <div id="perdisplay-container" class="d-flex center-flex perdisplay-container" >
            <img class="perdisplay" src="./img/portadaApi.jpg" alt="Perdisplay">

        </div>
    </section>
    <section id="perDatas" class="half" >
        <h3 id="perNameResult" class="center-flex" ></h3>
        <div class="center-flex" >
            <div>Vision: </div>
            <div id="perVision" class="perVision-container" ></div>

        </div>
        <table class="perData-table" > 
            <thead>
                <tr>
                    <td colspan="6" >Identidad del Personaje</td>
                    <td colspan="6">Descripcion</td>
                </tr>
                <tr>
                    <td>Weapon</td>
                    <td>Nation</td>
                    <td>Affiliation</td>
                    <td>Rarity</td>
                    <td>Birthday</td>
                    <td>Constellation</td>
                </tr>
            </thead>
            <tbody id="perData" >
                <tr>
                    <td class="per-data" id="personajeWeapon" >0</td>
                    <td class="per-data" id="personajeNation" >0</td>
                    <td class="per-data" id="personajeAffiliation" >0</td>
                    <td class="per-data" id="personajeRarity" >0</td>
                    <td class="per-data" id="personajeBirthday" >0</td>
                    <td class="per-data" id="personajeConstellation" >0</td>
                </tr>
            </tbody>
        </table>
        <div class="row center-flex" >
            <div class="row-element" >
                Talentos Activos:
                <ul id="perSkillTalents" ></ul>
            </div>
            <div class="row-element" >
                Talentos Pasivos:
                <ul id="perPassiveTalents" ></ul>
            </div>
            <div class="row-element" >
                Constelaciones:
                <ul id="perConstellations" ></ul>
            </div>
        </div>

    </section>
<script src="./js/fech.js"></script>
    
</body>
</html>
